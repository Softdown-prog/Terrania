name: Publicar Terrania no Cloudflare
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - '404.html'
      - '*/index.html'
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.mjs'
      - 'scripts/verify-build.mjs'
      - 'wrangler.jsonc'
      - 'tsconfig*.json'
      - 'tests/**'
      - 'scripts/resolve-worker-target.mjs'
      - 'scripts/verify-live-theme.mjs'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terrania-cloudflare-production
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'Softdown-prog/Terrania' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      VITE_MULTIPLAYER_URL: ${{ vars.TERRANIA_MULTIPLAYER_URL || 'wss://api-rpg.analysepro.com/ws' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Confirmar que o domínio pertence ao Worker configurado
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$CLOUDFLARE_ACCOUNT_ID" || -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo "::error::Configure os secrets CLOUDFLARE_ACCOUNT_ID e CLOUDFLARE_API_TOKEN no repositório Terrania."
            exit 1
          fi
          node scripts/resolve-worker-target.mjs

      - name: Instalar dependências
        run: npm ci
      - name: Validar tipos, regressões e gerar as nove páginas
        run: |
          npm run typecheck
          npm test
          npm run build

      - name: Preservar endpoint multiplayer e tema no build
        shell: bash
        run: |
          set -euo pipefail
          grep -q '#0b0812' dist/index.html
          grep -R -F -q '#b986ff' dist/assets --include='*.css'
          grep -R -F -q "$VITE_MULTIPLAYER_URL" dist/assets --include='*.js'

      - name: Identificar a revisão e validar o pacote
        env:
          TERRANIA_RELEASE_SHA: ${{ github.sha }}
        run: |
          node --input-type=module -e 'import { writeFileSync } from "node:fs"; writeFileSync("dist/release.json", JSON.stringify({ sha: process.env.TERRANIA_RELEASE_SHA }) + "\n")'
          npx --no-install wrangler deploy --dry-run

      - name: Publicar no Worker existente sem alterar seus domínios
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.156.0'
          command: deploy --message "GitHub ${{ github.sha }}"
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Confirmar nova paleta publicada no domínio público
        env:
          TERRANIA_RELEASE_SHA: ${{ github.sha }}
        run: node scripts/verify-live-theme.mjs
