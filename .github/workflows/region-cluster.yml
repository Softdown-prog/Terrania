name: Terrania regional cluster protocol (offline, no deploy)
on:
  pull_request:
    paths:
      - 'server-go/cluster/**'
      - 'server-go/engine/room_state*.go'
      - 'docs/REGION-CLUSTER.md'
      - '.github/workflows/region-cluster.yml'
  push:
    branches: [main, 'feat/go-rust-ffi-*']
    paths:
      - 'server-go/cluster/**'
      - 'server-go/engine/room_state*.go'
      - 'docs/REGION-CLUSTER.md'
      - '.github/workflows/region-cluster.yml'
permissions:
  contents: read
jobs:
  region-protocol:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server-go/go.mod
          cache-dependency-path: server-go/go.sum
      - name: Enforce gofmt for new cluster and codec code
        run: |
          set -euo pipefail
          gofmt -w server-go/cluster/handoff.go server-go/cluster/region.go server-go/cluster/region_handoff_test.go server-go/cluster/transfer_wire.go server-go/cluster/transfer_wire_test.go server-go/cluster/room_codec_test.go server-go/cluster/region_journal.go server-go/cluster/region_journal_test.go server-go/engine/room_state.go server-go/engine/room_state_test.go server-go/cluster/snapshot_archive.go server-go/cluster/snapshot_archive_test.go server-go/cluster/archive_wire_test.go server-go/cluster/recovery_inspect.go server-go/cluster/worker_runtime.go server-go/cluster/worker_runtime_test.go server-go/cluster/worker_lease.go server-go/cluster/worker_lease_test.go server-go/cluster/worker_lease_wire.go server-go/cluster/worker_lease_wire_test.go server-go/cluster/grant_coordinator.go server-go/cluster/grant_coordinator_test.go server-go/cluster/election_vote.go server-go/cluster/election_vote_test.go server-go/cluster/replica_log.go server-go/cluster/replica_log_test.go
          if ! git diff --quiet -- server-go/cluster server-go/engine/room_state.go server-go/engine/room_state_test.go; then
            echo 'Go source requires gofmt; generated formatting follows:'
            for file in $(git diff --name-only -- server-go/cluster server-go/engine/room_state.go server-go/engine/room_state_test.go); do
              echo "FORMATTED_FILE=${file} BASE64=$(base64 -w0 "$file")"
            done
            exit 1
          fi
      - name: Strict checks and concurrency tests
        working-directory: server-go
        run: |
          set -euo pipefail
          go mod verify
          go vet ./cluster ./cmd/gateway ./cmd/terrania
          go test -race -count=1 ./cluster -run '^TestJournal' -v
          go test -race -count=1 ./cluster -run '^(TestArchive|TestArchived|TestDurable)' -v
          go test -race -count=3 ./cluster -run '^(TestGuardedRoom|TestConcurrentRoomTick|TestRegionExecutionGates|TestCaptureAndFreeze|TestStagedRoom|TestRoomTransferNetwork)' -v
          go test -race -count=3 ./cluster -run '^(TestWorkerLease|TestPrivateLeaseTransport|TestRemoteMTLSRevoke|TestDisconnectedWorker|TestWorkerRevocation|TestWorkerGates)' -v
          go test -race -count=2 ./cluster -run '^TestGrantCoordinator' -v
          go test -race -count=3 ./cluster -run '^TestElection' -v
          go test -race -count=3 ./cluster -run '^TestReplica' -v
          go test -race -count=1 ./cluster ./cmd/gateway ./cmd/terrania
          go test -count=1 ./...
          go build ./cmd/gateway
          go build ./cmd/terrania
      - name: Stress multi-region transfer isolation
        working-directory: server-go
        run: |
          set -euo pipefail
          go test -race -count=3 ./cluster -run '^(TestParallelProvinceTransfersRemainIsolated|TestConcurrentPrivateSnapshotsBoundedByStagingBudget|TestPrivateSnapshotHTTPSMutualTLSAndCommit|TestPrivateWireCarriesRestorableGoRoom)$' -v
          echo '### Region ownership prototype — local only' >> "$GITHUB_STEP_SUMMARY"
          echo '512 regions x 3 concurrent transfer tests and live engine state roundtrip, with the Go race detector.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Durable hash-chained replica receipts and majority proofs tested offline. Not Raft, no replicated leader election or production VPS deploy.' >> "$GITHUB_STEP_SUMMARY"
