name: Terrania internal QA bot report (offline, no deploy)
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/qa/**'
      - 'scripts/qa-bot.mjs'
      - 'tests/qa-bot.test.ts'
      - '.github/workflows/qa-bot.yml'
permissions:
  contents: read
jobs:
  report:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run QA bot with real offline simulation
        run: node --experimental-strip-types scripts/qa-bot.mjs > qa-bot-report.json
      - name: Show findings in GitHub summary
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            const r = JSON.parse(fs.readFileSync("qa-bot-report.json", "utf8"));
            const lines = [
              "### QA-BOT-001 (offline only)",
              "Seed: " + r.seed + " | Ticks: " + r.ticks + " | Status: " + r.status,
              "Checks: " + r.totals.passed + " passed, " + r.totals.failed +
                " failed, " + r.totals.skipped + " skipped",
              "Visited map tiles: " + r.totals.mapTilesVisited +
                " | NPC interactions: " + r.totals.npcInteractions +
                " | Interiors: " + r.totals.interiorsVisited,
              "",
              "No multiplayer, browser, combat, progression or VPS tested."
            ];
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join("\n") + "\n");
          '
      - name: Upload detailed JSON
        uses: actions/upload-artifact@v4
        with:
          name: terrania-qa-bot-report
          path: qa-bot-report.json
          retention-days: 7
