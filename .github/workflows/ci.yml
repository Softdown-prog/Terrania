name: Verificar Terrania front-end e multiplayer
on:
  push:
    # Validation-only branch. No publish/deploy workflows use this ref.
    branches: [main, feat/angular-ui-phaser3, feat/terrania-classic-combat-20261104, feat/mcp-workspace-node24-20261111]
  pull_request:
jobs:
  validar:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Instalar front-end e servidor de teste
        run: npm ci && npm ci --prefix server
      - name: Conferir registro de módulos, limites e índices gerados
        run: npm run architecture:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run typecheck --prefix server
      - run: npm test --prefix server
      - run: npm run build --prefix server

      - name: Validar imagem Docker e endpoint /health
        run: |
          docker build -f server/Dockerfile -t terrania-ci:smoke .
          docker run -d --name terrania-smoke -p 127.0.0.1:18787:8787 \
            -e ALLOWED_ORIGINS=https://terrania-origins.pages.dev terrania-ci:smoke
          trap 'docker rm -f terrania-smoke >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 20); do
            if curl --silent --fail http://127.0.0.1:18787/health | grep -q '"status":"ok"'; then
              exit 0
            fi
            sleep 1
          done
          docker logs terrania-smoke
          exit 1

      - name: Instalar navegador de teste
        run: npx playwright install --with-deps chromium
      - name: Validar Angular, Phaser e presença real no navegador
        run: npm run test:browser
      - name: Validar empacotamento do Worker e assets (sem publicar)
        if: github.ref == 'refs/heads/main'
        run: npx --no-install wrangler deploy --dry-run

