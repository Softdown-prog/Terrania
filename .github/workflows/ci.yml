name: Verificar Terrania front-end e multiplayer
on:
  push:
    branches: [main]
  pull_request:
jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar front-end
        run: npm install
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Instalar servidor
        run: npm install --prefix server
      - run: npm run typecheck --prefix server
      - run: npm test --prefix server
      - run: npm run build --prefix server

      - name: Validar imagem Docker e endpoint /health
        run: |
          docker build -f server/Dockerfile -t terrania-ci:smoke .
          docker run -d --name terrania-smoke -p 127.0.0.1:18787:8787 \
            -e ALLOWED_ORIGINS=https://terrania-origins.pages.dev terrania-ci:smoke
          trap 'docker rm -f terrania-smoke >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 20); do
            if curl --silent --fail http://127.0.0.1:18787/health | grep -q '"status":"ok"'; then
              exit 0
            fi
            sleep 1
          done
          docker logs terrania-smoke
          exit 1
