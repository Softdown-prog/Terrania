name: Terrania one-VPS autoscaling policy (offline, no deploy)
on:
  push:
    branches: [main, 'feat/go-rust-ffi-*']
    paths:
      - 'server-go/autoscale/**'
      - 'docs/AUTOSCALING-ONE-VPS.md'
      - '.github/workflows/autoscale-lab.yml'
  pull_request:
    paths:
      - 'server-go/autoscale/**'
      - 'docs/AUTOSCALING-ONE-VPS.md'
      - '.github/workflows/autoscale-lab.yml'
permissions:
  contents: read
jobs:
  policy-laboratory:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server-go/go.mod
          cache-dependency-path: server-go/go.sum
      - name: Strict formatting check
        working-directory: server-go
        run: |
          set -euo pipefail
          result="$(gofmt -l autoscale/)"
          if [[ -n "$result" ]]; then
            echo "gofmt required for: $result"
            exit 1
          fi
      - name: Go vet and race detector
        working-directory: server-go
        run: |
          set -euo pipefail
          go vet ./autoscale
          go test -race -count=5 ./autoscale -v
      - name: Check integration with existing Go module
        working-directory: server-go
        run: |
          set -euo pipefail
          go test -count=1 ./...
          go build ./cmd/gateway
          go build ./cmd/terrania
      - name: Document scope of this offline test
        run: |
          echo '### One-VPS autoscaling — decision engine only' >> "$GITHUB_STEP_SUMMARY"
          echo 'Viral demand scenarios, CPU/RAM bounds, cooldown, drain-before-stop and 5 race-enabled repetitions.' >> "$GITHUB_STEP_SUMMARY"
          echo '**No Docker operations; no VPS deploy; no dynamic gateway routing; no 10k/1m live sockets.**' >> "$GITHUB_STEP_SUMMARY"
