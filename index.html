<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#142920" />
    <meta name="description" content="Terrania: Origins — protótipo de RPG 2D procedural no navegador, sem sprites ou PNGs." />
    <title>Terrania: Origins · Multiplayer 0.2</title>
  </head>
  <body>
    <main id="app" aria-label="Jogo Terrania: Origins">
      <canvas id="game" aria-label="Mundo do jogo em Canvas 2D"></canvas>
      <header class="hud">
        <div class="brand"><strong>TERRANIA</strong><span>ORIGINS <small>0.2</small></span></div>
        <div class="stats">
          <div class="stat"><span>VIDA</span><div class="meter"><div id="hpFill"></div></div><b id="hpText">100 / 100</b></div>
          <div class="stat"><span>MISSÃO</span><b id="quest">Derrote 5 slimes (0/5)</b></div>
          <div class="stat"><span>CONEXÃO</span><b id="multiplayerStatus">Iniciando…</b><small id="playerCount">1 jogador</small></div>
          <div class="stat seed"><span>MUNDO</span><b id="seed">—</b></div>
        </div>
      </header>
      <div class="bottom-info"><span id="coords">X 0 · Y 0</span><span>WASD / setas · Espaço / J para atacar</span></div>
      <button id="newWorld" type="button" title="Gerar um novo mundo">Novo mundo</button>
      <div id="joystick" aria-label="Controle virtual de movimentação"><div id="stick"></div></div>
      <button id="attack" type="button" aria-label="Atacar">⚔</button>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
